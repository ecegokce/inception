version: "3.8"

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      # Named volume, not a bind mount, per subject — but its `local`
      # driver with these opts makes it physically live under
      # /home/egokce/data/mariadb on the host (created by `make all`).
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    healthcheck:
      # Used by wordpress's `depends_on: condition: service_healthy`
      # instead of a sleep/poll loop in an entrypoint script.
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    env_file: .env
    volumes:
      # nginx only ever reads these files (php-fpm is the one writing them).
      - wordpress_data:/var/www/html:ro
    ports:
      # 443 only — nginx is the sole entrypoint, no plain HTTP port exposed.
      - "443:443"
    networks:
      - inception
    restart: always
    depends_on:
      - wordpress

networks:
  # User-defined network, as required by the subject (no `network: host`,
  # no legacy `--link`/`links:`).
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/egokce/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/egokce/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
