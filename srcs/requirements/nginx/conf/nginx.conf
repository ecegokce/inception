user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 768;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;

	server {
		# Port 443 only — nginx is the sole entrypoint and the subject
		# forbids plain HTTP, so there is no `listen 80` at all.
		listen 443 ssl;
		server_name egokce.42.fr;

		ssl_certificate     /etc/nginx/ssl/egokce.42.fr.crt;
		ssl_certificate_key /etc/nginx/ssl/egokce.42.fr.key;

		# Subject requirement: TLSv1.2 and TLSv1.3 only (no TLSv1/1.1).
		ssl_protocols TLSv1.2 TLSv1.3;

		root /var/www/html;
		index index.php index.html;

		location / {
			# Needed for WordPress's pretty permalinks: fall back to
			# index.php, which then does its own internal routing.
			try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
			# php-fpm runs in the separate "wordpress" container; there is
			# no nginx or php inside it, so every .php request is
			# forwarded there over the docker network, by service name.
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		location ~ /\.ht {
			deny all;
		}
	}
}
