[www]
user = www-data
group = www-data

; Must bind to all interfaces, not the package default 127.0.0.1:9000,
; because nginx runs in a different container and reaches this one only
; over the user-defined docker network, by service name.
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep php-fpm's own logs on stdout/stderr like every other container
; process, instead of writing to a log file no one will look at.
catch_workers_output = yes
decorate_workers_output = no
